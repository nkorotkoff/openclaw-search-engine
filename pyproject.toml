[project]
name = "scrapper-engine"
version = "0.1.0"
description = "Stealth web scraper for OpenClaw search tool"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "camoufox>=0.4",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.scripts]
scrapper = "scrapper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
